name: Teaching update validation
on:
  push:
    branches: [codex/teaching-first-v5-4-0]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:course && npm run check:release
      - name: Package reproducible test workspace
        if: always()
        run: tar --exclude=.git --exclude=workspace.tar.gz -czf "$RUNNER_TEMP/workspace.tar.gz" .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teaching-test-workspace
          path: ${{ runner.temp }}/workspace.tar.gz
          retention-days: 1
