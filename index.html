<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mochi · Euna’s maths studio</title>
<meta name="theme-color" content="#f7f5fc">
<style>
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#FDF2EC;color:#2A1F1A}.boot{min-height:100vh;display:grid;place-items:center}.boot>div{text-align:center}.paw{font-size:42px;animation:b 1.2s ease-in-out infinite}@keyframes b{50%{transform:translateY(-7px)}}.boot p{font-weight:700;color:#806B60}
</style>
</head>
<body>
<div class="boot"><div><div class="paw">🐾</div><p>Opening Mochi…</p></div></div>
<script>
(async()=>{
  const VERSION='4.3.4';
  const MARK='mochi-direct-index-version';
  try{
    if(localStorage.getItem(MARK)!==VERSION){
      if('serviceWorker' in navigator){
        const regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r=>r.unregister().catch(()=>{})));
      }
      if('caches' in window){
        const keys=await caches.keys();
        await Promise.all(keys.filter(k=>k.startsWith('mochi-')).map(k=>caches.delete(k)));
      }
      localStorage.setItem(MARK,VERSION);
    }
    const r=await fetch('legacy-shell.html?app='+VERSION,{cache:'no-store'});
    if(!r.ok)throw new Error('Could not load app shell');
    let html=await r.text();
    html=html.replaceAll('v4.2.1','v'+VERSION)
             .replaceAll('2026-09-11','2026-09-13')
             .replaceAll('11 September 2026','13 September 2026')
             .replaceAll('?v=4.2.1','?v='+VERSION);
    const extra=[
      'baseline-week.js','quest-observer-guard.js','quest-visuals.js','perf-hotfix.js',
      'cloud-sync.js','cloud-backup.js','drive-mirror.js','motion-runtime.js','release-marker.js','version-lock.js'
    ].map(x=>'<script src="'+x+'?v='+VERSION+'"><\\/script>').join('');
    html=html.replace('</body>',extra+'</body>');
    document.open();document.write(html);document.close();
  }catch(err){
    document.body.innerHTML='<div class="boot"><div><h2>Mochi could not open</h2><p>'+String(err.message||err)+'</p><button onclick="location.reload()">Try again</button></div></div>';
  }
})();
</script>
</body>
</html>
