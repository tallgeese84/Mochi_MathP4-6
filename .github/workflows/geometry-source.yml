name: Geometry source workspace
on:
  push:
    branches: [codex/geometry-bridge-v6-7-0]
    paths: [.github/workflows/geometry-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7db43ac61f7425af8f16814dc9b3b37ccdd63fc6
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Archive tracked baseline and local test dependencies only
        run: |
          git archive --format=tar HEAD > "$RUNNER_TEMP/mochi-baseline.tar"
          tar -cf "$RUNNER_TEMP/mochi-test-dependencies.tar" node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: geometry-workspace
          path: |
            ${{ runner.temp }}/mochi-baseline.tar
            ${{ runner.temp }}/mochi-test-dependencies.tar
          retention-days: 1
