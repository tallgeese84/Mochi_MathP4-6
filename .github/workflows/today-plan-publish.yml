name: Today plan release validation
on:
  push:
    branches: [codex/today-plan-v6-2-0]
permissions:
  contents: write
jobs:
  validate:
    if: github.ref == 'refs/heads/codex/today-plan-v6-2-0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Assemble checksum-verified reviewed source
        run: python3 scripts/assemble-today.py
      - run: npm ci --ignore-scripts
      - name: Full regression and content validation
        run: |
          set -euo pipefail
          npm run check:release
          npm run check:course
          npm test | tee "$RUNNER_TEMP/today-tests.log"
      - name: Actual Chrome page and controls
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/today-server.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/release.json && break || sleep 0.2; done
          chrome=$(command -v google-chrome || command -v google-chrome-stable)
          timeout 75s "$chrome" --headless --no-sandbox --enable-unsafe-swiftshader --use-angle=swiftshader --disable-dev-shm-usage --user-data-dir="$RUNNER_TEMP/today-chrome" --window-size=1280,1200 --timeout=60000 --virtual-time-budget=18000 --screenshot="$RUNNER_TEMP/today-home.png" --dump-dom http://127.0.0.1:8765/tests/fixtures/today-browser.html > "$RUNNER_TEMP/today-browser.html" 2> "$RUNNER_TEMP/today-browser.log"
          grep -q 'data-result="passed"' "$RUNNER_TEMP/today-browser.html"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: today-plan-validation
          path: |
            ${{ runner.temp }}/today-home.png
            ${{ runner.temp }}/today-browser.html
            ${{ runner.temp }}/today-browser.log
            ${{ runner.temp }}/today-tests.log
          retention-days: 2
      - name: Commit verified source to working branch only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          for name, checksum in json.loads(Path(os.environ['RUNNER_TEMP'], 'today-expected.json').read_text()).items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == checksum, name+' changed during tests'
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --check --cached
          git commit -m 'Finalize v6.2.0 Today plan after full regression and Chrome control tests'
          git push origin HEAD:refs/heads/codex/today-plan-v6-2-0
