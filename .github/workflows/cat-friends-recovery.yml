name: Cat Friends recovery validation
on:
  push:
    branches: [codex/cat-friends-recovery-v5-5-1]
permissions:
  contents: write
jobs:
  validate:
    if: github.ref == 'refs/heads/codex/cat-friends-recovery-v5-5-1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - name: Apply checked baseline patch and regenerate release assets
        run: python3 scripts/assemble-cat-recovery.py
      - run: npm ci --ignore-scripts
      - name: Full regression checks
        run: |
          npm run check:release
          npm run check:course
          npm test | tee "$RUNNER_TEMP/cat-recovery-tests.log"
      - name: Chrome saved-state and interrupted-renderer recovery
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/cat-recovery-server.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/release.json && break || sleep 0.2; done
          chrome=$(command -v google-chrome || command -v google-chrome-stable)
          timeout 75s "$chrome" --headless --no-sandbox --enable-unsafe-swiftshader --use-angle=swiftshader --disable-dev-shm-usage --user-data-dir="$RUNNER_TEMP/cat-recovery-chrome" --window-size=1280,1800 --timeout=60000 --virtual-time-budget=20000 --screenshot="$RUNNER_TEMP/cat-recovery-room.png" --dump-dom http://127.0.0.1:8765/tests/fixtures/cat-friends-upgrade.html > "$RUNNER_TEMP/cat-recovery-browser.html" 2> "$RUNNER_TEMP/cat-recovery-browser.log"
          grep -q 'data-result="passed"' "$RUNNER_TEMP/cat-recovery-browser.html"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cat-friends-recovery-validation
          path: |
            ${{ runner.temp }}/cat-recovery-room.png
            ${{ runner.temp }}/cat-recovery-browser.html
            ${{ runner.temp }}/cat-recovery-browser.log
            ${{ runner.temp }}/cat-recovery-tests.log
          retention-days: 1
      - name: Commit verified fix to working branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --check --cached
          git commit -m 'Finalize v5.5.1 Cat Friends visibility and renderer recovery after validation'
          git push origin HEAD:refs/heads/codex/cat-friends-recovery-v5-5-1
