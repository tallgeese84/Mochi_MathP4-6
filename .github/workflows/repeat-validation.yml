name: Validate repetition repair
on:
  push:
    branches: [fix/repeated-question-selection]
permissions:
  contents: read
concurrency:
  group: repetition-repair-validation
  cancel-in-progress: true
jobs:
  validate:
    if: github.ref == 'refs/heads/fix/repeated-question-selection'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply digest-verified public source changes
        run: node tools/apply-repetition-fix.cjs
      - name: Synchronize release assets
        run: node scripts/release.cjs
      - run: npm ci --ignore-scripts
      - run: npm run check:release
      - run: npm run check:course
      - name: All engine and full-page regression tests
        run: npm test
      - name: Commit validated repair to isolated branch
        run: |
          git rm .github/workflows/repeat-validation.yml tools/apply-repetition-fix.cjs tools/repeat-patch-1.b64 tools/repeat-patch-2.b64 tools/repeat-patch-3.b64 tools/repeat-patch-4.b64
          git add path-core.js entrance-core.js science-path-core.js nightly-plan-core.js entrance-ui.js science-path-ui.js today-core.js today-ui.js docs/NIGHTLY_PLAN.md release.json tests/dsa-readiness.test.cjs tests/repetition-guard.test.cjs tests/repetition-browser.test.cjs tests/fixtures/repetition-guard.cjs app.js index.html sw.js manifest.webmanifest
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Stop repeated-question loops and release v7.7.7'
          git push origin HEAD:refs/heads/fix/repeated-question-selection
