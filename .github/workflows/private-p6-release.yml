name: Private P6 reader validation
on:
  push:
    branches: [codex/private-p6-v7-5-0]
permissions:
  contents: write
jobs:
  validate:
    if: github.ref == 'refs/heads/codex/private-p6-v7-5-0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Assemble checksum-reviewed public source
        run: python3 scripts/assemble-private-p6.py
      - run: npm ci --ignore-scripts
      - name: Complete regression and release checks
        run: |
          set -euo pipefail
          npm run check:release
          npm run check:course
          npm test | tee "$RUNNER_TEMP/p6-tests.log"
      - name: Real HTTP Chrome import, progress, timers and assessment protection
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/p6-server.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/release.json && break || sleep 0.2; done
          chrome=$(command -v google-chrome || command -v google-chrome-stable)
          timeout 100s "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir="$RUNNER_TEMP/p6-chrome" --window-size=1280,1700 --timeout=90000 --virtual-time-budget=45000 --screenshot="$RUNNER_TEMP/p6-browser.png" --dump-dom http://127.0.0.1:8765/tests/fixtures/p6-browser.html > "$RUNNER_TEMP/p6-browser.html" 2> "$RUNNER_TEMP/p6-browser.log"
          grep -q 'data-result="passed"' "$RUNNER_TEMP/p6-browser.html"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-p6-synthetic-validation
          path: |
            ${{ runner.temp }}/p6-tests.log
            ${{ runner.temp }}/p6-browser.html
            ${{ runner.temp }}/p6-browser.png
            ${{ runner.temp }}/p6-browser.log
          retention-days: 2
      - name: Commit tested public implementation to working branch only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,hashlib,json
          for name,sha in json.loads(Path(os.environ['RUNNER_TEMP'],'p6-reviewed.json').read_text()).items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==sha,name+' changed during tests'
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --check --cached
          git commit -m 'Finalize v7.5.0 private P6 reader after regression and real-browser checks'
          git push origin HEAD:refs/heads/codex/private-p6-v7-5-0
