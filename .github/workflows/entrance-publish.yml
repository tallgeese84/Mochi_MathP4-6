name: Entrance pathway release validation
on:
  push:
    branches: [codex/entrance-path-v6-0-0]
permissions:
  contents: write
jobs:
  validate:
    if: github.ref == 'refs/heads/codex/entrance-path-v6-0-0'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Assemble exact reviewed sources
        run: |
          python3 scripts/assemble-entrance.py
          git add -A
          tree=$(git write-tree)
          echo "Reviewed production tree: $tree"
          test "$tree" = '41e69fffe29b80e8e3bd5416ff907fc7476458fb'
      - run: npm ci --ignore-scripts
      - name: Full regression and content validation
        shell: bash
        run: |
          set -o pipefail
          npm run check:release
          npm run check:course
          npm test | tee "$RUNNER_TEMP/entrance-tests.log"
      - name: Actual Chrome page and controls
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/entrance-server.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/release.json && break || sleep 0.2; done
          chrome=$(command -v google-chrome || command -v google-chrome-stable)
          timeout 75s "$chrome" --headless --no-sandbox --enable-unsafe-swiftshader --use-angle=swiftshader --disable-dev-shm-usage --user-data-dir="$RUNNER_TEMP/entrance-chrome" --window-size=1280,1700 --timeout=60000 --virtual-time-budget=18000 --screenshot="$RUNNER_TEMP/entrance-room.png" --dump-dom http://127.0.0.1:8765/tests/fixtures/entrance-browser.html > "$RUNNER_TEMP/entrance-browser.html" 2> "$RUNNER_TEMP/entrance-browser.log"
          grep -q 'data-result="passed"' "$RUNNER_TEMP/entrance-browser.html"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: entrance-path-validation
          path: |
            ${{ runner.temp }}/entrance-tests.log
            ${{ runner.temp }}/entrance-room.png
            ${{ runner.temp }}/entrance-browser.html
            ${{ runner.temp }}/entrance-browser.log
          retention-days: 2
      - name: Commit verified release to its working branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'Finalize v6.0.0 entrance pathway after full regression and browser validation'
          git push origin HEAD:refs/heads/codex/entrance-path-v6-0-0
