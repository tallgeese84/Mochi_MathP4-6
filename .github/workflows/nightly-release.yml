name: Private nightly-plan integration validation
on:
  push:
    branches: [codex/nightly-plan-v7-7-0]
permissions:
  contents: write
jobs:
  validate:
    if: github.ref == 'refs/heads/codex/nightly-plan-v7-7-0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Assemble exact reviewed public source
        run: |
          set -euo pipefail
          python3 scripts/assemble-nightly.py
          git add -A
          echo "Production tree: $(git write-tree)"
          test "$(git write-tree)" = 'e86bef1f72772d57fe63acf80c73f766f2bd4c2d'
      - run: npm ci --ignore-scripts
      - name: Full regression and content validation
        run: |
          set -euo pipefail
          npm run check:release
          npm run check:course
          npm test | tee "$RUNNER_TEMP/nightly-tests.log"
      - name: Actual Chrome app and simulated private relay
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/nightly-server.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/release.json && break || sleep 0.2; done
          chrome=$(command -v google-chrome || command -v google-chrome-stable)
          timeout 75s "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir="$RUNNER_TEMP/nightly-chrome" --window-size=1280,1450 --timeout=60000 --virtual-time-budget=22000 --screenshot="$RUNNER_TEMP/nightly-home.png" --dump-dom http://127.0.0.1:8765/tests/fixtures/nightly-plan-browser.html > "$RUNNER_TEMP/nightly-browser.html" 2> "$RUNNER_TEMP/nightly-browser.log"
          grep -q 'data-result="passed"' "$RUNNER_TEMP/nightly-browser.html"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-plan-validation
          path: |
            ${{ runner.temp }}/nightly-home.png
            ${{ runner.temp }}/nightly-browser.html
            ${{ runner.temp }}/nightly-browser.log
            ${{ runner.temp }}/nightly-tests.log
          retention-days: 2
      - name: Commit verified source on working branch only
        run: |
          set -euo pipefail
          git add -A
          test "$(git write-tree)" = 'e86bef1f72772d57fe63acf80c73f766f2bd4c2d'
          git diff --check --cached
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finalize v7.7.0 private nightly-plan integration after regression and browser validation'
          git push origin HEAD:refs/heads/codex/nightly-plan-v7-7-0
