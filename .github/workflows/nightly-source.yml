name: Nightly plan source workspace
on:
  push:
    branches: [codex/nightly-plan-v7-7-0]
    paths: [.github/workflows/nightly-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive 1d2b27cb76876c4f9e94eebae14ca56b0461290b | gzip > "$RUNNER_TEMP/mochi-baseline.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-plan-baseline
          path: ${{ runner.temp }}/mochi-baseline.tar.gz
          retention-days: 1
