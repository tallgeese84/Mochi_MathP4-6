name: Validate three-question microcycles
on:
  push:
    branches: [feature/three-question-microcycles]
permissions:
  contents: write
concurrency:
  group: microcycle-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Generate release assets
        run: node scripts/release.cjs
      - run: npm run check:release
      - run: npm run check:course
      - run: npm test
      - name: Commit generated release files after validation
        run: |
          git rm .github/workflows/microcycle-validation.yml
          git add index.html app.js sw.js manifest.webmanifest
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Validate v7.7.6 microcycle release'
          git push origin HEAD:refs/heads/feature/three-question-microcycles
