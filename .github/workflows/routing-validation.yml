name: Routing validation snapshot
on:
  push:
    branches: [fix/daily-focus-handoff]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked public source only
        run: git archive --format=zip HEAD -o "$RUNNER_TEMP/routing-source.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: routing-public-source
          path: ${{ runner.temp }}/routing-source.zip
          retention-days: 1
