name: Learning quality release validation
on:
  push:
    branches: [codex/learning-quality-v7-6-0]
permissions:
  contents: write
jobs:
  validate:
    if: github.ref == 'refs/heads/codex/learning-quality-v7-6-0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Assemble reviewed sources
        run: |
          set -euo pipefail
          python3 scripts/assemble-learning-quality.py
          git add -A
          git write-tree | tee "$RUNNER_TEMP/quality-tree.txt"
      - run: npm ci --ignore-scripts
      - name: Full regression and content validation
        run: |
          set -euo pipefail
          npm run check:release
          npm run check:course
          npm test | tee "$RUNNER_TEMP/quality-tests.log"
      - name: Actual Chrome page and controls
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/quality-server.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/release.json && break || sleep 0.2; done
          chrome=$(command -v google-chrome || command -v google-chrome-stable)
          timeout 75s "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir="$RUNNER_TEMP/quality-chrome" --window-size=1280,1800 --timeout=60000 --virtual-time-budget=22000 --screenshot="$RUNNER_TEMP/quality-app.png" --dump-dom http://127.0.0.1:8765/tests/fixtures/learning-quality-browser.html > "$RUNNER_TEMP/quality-browser.html" 2> "$RUNNER_TEMP/quality-browser.log"
          grep -q 'data-result="passed"' "$RUNNER_TEMP/quality-browser.html"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learning-quality-validation
          path: |
            ${{ runner.temp }}/quality-app.png
            ${{ runner.temp }}/quality-browser.html
            ${{ runner.temp }}/quality-browser.log
            ${{ runner.temp }}/quality-tests.log
            ${{ runner.temp }}/quality-tree.txt
          retention-days: 2
      - name: Commit verified source to working branch only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          for name,checksum in json.loads(Path(os.environ['RUNNER_TEMP'],'quality-expected.json').read_text()).items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==checksum, name+' changed during tests'
          PY
          git add -A
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/quality-tree.txt")"
          git diff --check --cached
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finalize v7.6.0 learning quality after regression and Chrome checks'
          git push origin HEAD:refs/heads/codex/learning-quality-v7-6-0
