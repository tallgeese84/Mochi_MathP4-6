name: Repetition regression validation
on:
  push:
    branches: [fix/repeated-question-selection]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked public source only
        run: git archive --format=zip HEAD -o "$RUNNER_TEMP/repeat-source.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: repeat-public-source
          path: ${{ runner.temp }}/repeat-source.zip
          retention-days: 1
